name: CI

# Roda em todo PR e em todo push na main (requisito do PDF). Na main, além de validar, publica as três
# imagens no GitHub Container Registry com a tag = SHA do commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ConexaoSolidaria.slnx

      # NuGetAudit (Directory.Build.props) já quebra o restore/build com vulnerabilidade High/Critical;
      # este passo deixa o relatório completo visível no log.
      - name: Dependências vulneráveis
        run: dotnet list ConexaoSolidaria.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build ConexaoSolidaria.slnx -c Release --no-restore

      - name: Testes (unidade e integração)
        # Um módulo de teste por vez: os de integração sobem PostgreSQL, RabbitMQ e Redis (Testcontainers),
        # e vários brokers subindo juntos competem pela máquina e atrasam o handshake AMQP.
        run: >-
          dotnet test --solution ConexaoSolidaria.slnx -c Release --no-build --max-parallel-test-modules 1
          --report-xunit-trx --results-directory ${{ github.workspace }}/resultados-testes

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: resultados-testes/**/*.trx
          if-no-files-found: ignore

  manifestos:
    name: Manifestos e scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint de YAML
        run: |
          pip install --quiet yamllint==1.37.1
          yamllint -s deploy docker-compose.yml .github .yamllint

      - name: docker-compose válido
        run: docker compose config --quiet

      - name: Manifestos Kubernetes (kubeconform)
        run: |
          versao=v0.7.0
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${versao}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          # O Kustomize renderiza os manifestos como o "kubectl apply -k" faz (inclusive os ConfigMaps gerados).
          kubectl kustomize deploy/k8s > manifestos.yaml
          ./kubeconform -strict -summary manifestos.yaml

      - name: Dashboard do Grafana é JSON válido
        run: jq empty deploy/k8s/observabilidade/dashboards/*.json

      - name: Scripts (shellcheck)
        run: shellcheck scripts/*.sh

  ponta-a-ponta:
    name: Ponta a ponta (docker compose)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prova que as três imagens constroem, iniciam e funcionam juntas: sobe a plataforma inteira e
      # executa a coleção Postman do fluxo do PDF (cadastro → login → campanha → doação → worker → painel).
      - name: Subir a plataforma
        run: docker compose up --build --detach --wait --wait-timeout 300 postgres rabbitmq redis

      - name: Subir os serviços
        run: |
          docker compose up --build --detach usuarios-api campanhas-api doacoes-worker
          for porta in 5081 5082 5083; do
            for tentativa in $(seq 1 60); do
              if curl -fsS "http://localhost:${porta}/health/ready" > /dev/null; then
                echo "porta ${porta} pronta"
                break
              fi
              if [ "$tentativa" -eq 60 ]; then
                echo "::error::serviço na porta ${porta} não ficou pronto"
                exit 1
              fi
              sleep 3
            done
          done

      - name: Fluxo completo (coleção Postman)
        run: >-
          npx --yes newman@6.2.1 run docs/postman/conexao-solidaria.postman_collection.json
          -e docs/postman/local.postman_environment.json --color on

      - name: Logs dos serviços
        if: always()
        run: docker compose logs --no-color usuarios-api campanhas-api doacoes-worker | tail -n 300

      - name: Derrubar
        if: always()
        run: docker compose down --volumes

  imagens:
    name: Imagem ${{ matrix.servico }}
    runs-on: ubuntu-latest
    needs: [build-and-test, manifestos, ponta-a-ponta]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - servico: usuarios-api
            dockerfile: src/Usuarios/Usuarios.Api/Dockerfile
          - servico: campanhas-api
            dockerfile: src/Campanhas/Campanhas.Api/Dockerfile
          - servico: doacoes-worker
            dockerfile: src/Doacoes/Doacoes.Worker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag = SHA do commit: a imagem é rastreável até o código e nunca é sobrescrita. Sem "latest".
      - name: Build e push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.servico }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.servico }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}

      - name: Resumo
        run: |
          {
            echo "### ${{ matrix.servico }}"
            echo ""
            echo "\`ghcr.io/${{ github.repository }}/${{ matrix.servico }}:${{ github.sha }}\`"
            echo ""
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
