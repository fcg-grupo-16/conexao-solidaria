# PostgreSQL 17: um servidor, um database por serviço (usuariosdb e campanhasdb). ADR 0002.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: conexao-solidaria
data:
  01-databases.sql: |
    CREATE DATABASE usuariosdb;
    CREATE DATABASE campanhasdb;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: conexao-solidaria
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: conexao-solidaria
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: conexao-solidaria
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgres, key: usuario }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: senha }
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d campanhasdb"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
