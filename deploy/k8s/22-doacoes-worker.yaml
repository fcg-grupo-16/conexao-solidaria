# doacoes-worker: consome DoacaoRecebidaEvent e soma o valor arrecadado (não migra; espera o esquema).
# Valores sensíveis vêm de Secrets; o resto de ConfigMaps. Todos os valores são de DEMONSTRAÇÃO.
apiVersion: v1
kind: ConfigMap
metadata:
  name: doacoes-worker
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: doacoes-worker
    app.kubernetes.io/part-of: conexao-solidaria
data:
  ConnectionStrings__Redis: redis:6379
  Banco__SegundosParaAguardarEsquema: "300"
---
apiVersion: v1
kind: Service
metadata:
  name: doacoes-worker
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: doacoes-worker
    app.kubernetes.io/part-of: conexao-solidaria
spec:
  selector:
    app.kubernetes.io/name: doacoes-worker
  ports:
    # Mesma porta do container e do docker compose: o gateway usa o mesmo endereço nos dois ambientes.
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doacoes-worker
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: doacoes-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: conexao-solidaria
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: doacoes-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doacoes-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: conexao-solidaria
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: doacoes-worker
          image: conexao-solidaria/doacoes-worker:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: plataforma
            - configMapRef:
                name: doacoes-worker
          env:
            - name: POSTGRES_USUARIO
              valueFrom:
                secretKeyRef: { name: postgres, key: usuario }
            - name: POSTGRES_SENHA
              valueFrom:
                secretKeyRef: { name: postgres, key: senha }
            # $(VAR) é expandido pelo Kubernetes a partir das variáveis acima: a senha fica só no Secret.
            - name: ConnectionStrings__CampanhasDb
              value: Host=postgres;Database=campanhasdb;Username=$(POSTGRES_USUARIO);Password=$(POSTGRES_SENHA)
            - name: RabbitMq__Usuario
              valueFrom:
                secretKeyRef: { name: rabbitmq, key: usuario }
            - name: RabbitMq__Senha
              valueFrom:
                secretKeyRef: { name: rabbitmq, key: senha }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 70
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          lifecycle:
            preStop:
              # Dá tempo ao Service de tirar o pod do balanceamento antes de o processo parar.
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
