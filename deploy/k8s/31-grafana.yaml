# Grafana com datasource e dashboard PROVISIONADOS: abre pronto, sem configuração manual.
# A fonte do dashboard é observabilidade/dashboards/conexao-solidaria.json.
apiVersion: v1
kind: Secret
metadata:
  name: grafana
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: conexao-solidaria
type: Opaque
stringData:
  # Valores de DEMONSTRAÇÃO.
  usuario: admin
  senha: conexao-demo
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: conexao-solidaria
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observabilidade
    app.kubernetes.io/part-of: conexao-solidaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observabilidade
        app.kubernetes.io/part-of: conexao-solidaria
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: grafana, key: usuario }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana, key: senha }
            # Visualização sem login (somente leitura), para a demonstração e a correção.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/conexao-solidaria.json
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provedores
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: dados
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: provedores
          configMap:
            name: grafana-dashboard-provedores
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: dados
          emptyDir: {}
