# API Gateway (KrakenD, bônus do PDF): ponto único de entrada que roteia para a usuarios-api e a
# campanhas-api. Repassa Authorization e as respostas sem alteração (no-op); quem valida o JWT são
# os serviços. A configuração vem de gateway/krakend.json (configMapGenerator).
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: conexao-solidaria
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: conexao-solidaria
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: conexao-solidaria
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: conexao-solidaria
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: krakend
          image: krakend:2.13.11
          args: ["run", "-c", "/etc/krakend/krakend.json"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /__health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /__health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: configuracao
              mountPath: /etc/krakend
              readOnly: true
      volumes:
        - name: configuracao
          configMap:
            name: gateway-config
